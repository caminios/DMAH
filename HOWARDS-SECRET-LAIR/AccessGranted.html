<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESTRICTED AREA - CLAIM PARCEL</title>
    <style>
        body {
            background-color: #12100e;
            color: #ffb000;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            background-color: #1c1814;
            border: 4px solid #ffb000;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 25px rgba(255, 176, 0, 0.2);
        }
        h2 {
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px dashed #ffb000;
            padding-bottom: 0.5rem;
            font-size: 1.1rem;
            white-space: pre-line;
        }
        p {
            font-size: 0.8rem;
            color: #cc8800;
            line-height: 1.4;
            white-space: pre-line;
        }
        label {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            background: #000;
            border: 2px solid #ffb000;
            color: #ffb000;
            padding: 0.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            margin-top: 0.3rem;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            background: #2a2218;
        }
        button {
            width: 100%;
            background-color: #ffb000;
            color: #12100e;
            border: none;
            padding: 0.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 1.5rem;
            cursor: pointer;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #ffc843;
        }
        #error-msg {
            color: #ff4444;
            margin-top: 1rem;
            display: none;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="terminal">
    <h2>Access Granted: 
Welcome Howard!</h2>
    <p>Fill out the form below to recieve your parcel.</p>
    
    <div id="error-msg">> ERROR: INVALID VERIFICATION CODE</div>
    
    <!-- Vi använder onsubmit för att köra vår JavaScript-kontroll innan mailet skickas -->
    <form id="claimForm" action="mailto:caminios+DMAH@gmail.com" method="POST" enctype="text/plain" onsubmit="return validateCode(event)">
        
        <label for="name">> YOUR NAME / HANDLE:</label>
        <input type="text" id="name" name="Name" required autocomplete="off">
        
        <label for="contact">> CONTACT INFO (EMAIL/PHONE):</label>
        <input type="text" id="contact" name="Contact" required autocomplete="off">
        
        <label for="code">> VERIFICATION CODE:</label>
        <input type="text" id="code" name="Code" placeholder="Enter secret code..." required autocomplete="off">
        
        <button type="submit">SEND CLAIM</button>
    </form>
</div>

<script>
    function validateCode(event) {
        var inputCode = document.getElementById('code').value.trim();
        var correctCode = "1-900-410-DUCK";

        if (inputCode === correctCode) {
            // Om koden stämmer låter vi formuläret skickas iväg
            return true;
        } else {
            // Om koden är fel stoppar vi inskickningen och visar felmeddelande
            event.preventDefault();
            document.getElementById('error-msg').style.display = "block";
            return false;
        }
    }
</script>

</body>
</html>

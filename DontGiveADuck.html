<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Det är en gåta...</title>
    <style>
        /* Enkel styling för att göra det lite snyggt */
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f0f0; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { display: block; width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.5rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #error-msg { color: red; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Logga in</h2>
    <p id="error-msg">Fel användarnamn eller lösenord.</p>
    <input type="text" id="username" placeholder="Användarnamn" required>
    <input type="password" id="password" placeholder="Lösenord" required>
    <button onclick="checkLogin()">Logga in</button>
    <p style="font-size: 0.8em; color: #666; margin-top: 1rem;">Ledtråden finns... där du minst anar den.</p>
</div>

<script>
    function checkLogin() {
        // Hämta värdena från inputfälten
        var inputUsername = document.getElementById('username').value;
        var inputPassword = document.getElementById('password').value;

        // --- ÄNDRA DESSA VÄRDEN TILL DINA EGNA ---
        var correctUsername = "Howard";
        var correctPassword = "D4FFY";
        // ----------------------------------------

        // Kontrollera om båda matchar
        if (inputUsername === correctUsername && inputPassword === correctPassword) {
            // Om det stämmer, skicka vidare till den hemliga sidan
            window.location.href = "hemlighet.html";
        } else {
            // Om det är fel, visa felmeddelandet
            document.getElementById('error-msg').style.display = "block";
        }
    }
</script>

</body>
</html>
